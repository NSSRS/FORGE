# Unloaded differential bench: IDs 1/2 CAN1, ID 3 CAN2; motor 4 absent.
# Full four-wheel mixing is retained. Set bench_omit_motor_id: 0 when restored.
# Confirm physical wheel signs before use; see docs/DIFFERENTIAL_DRIVE.md.
forge_motor_driver:
  ros__parameters:
    command_mode: chassis
    simulate: true
    execute: false
    mapping_confirmed: false
    interface: enp86s0
    max_current_a: 2.0
    motor_ids: [1, 2, 3, 4]
    motor_slots: [0, 1, 3, 4]  # IDs 3/4 on CAN2 when both are present.
    bench_omit_motor_id: 4
    wheel_motor_ids: [1, 2, 3, 4]  # wheel_1, wheel_2, wheel_3, wheel_4
    wheel_sides: [left, left, right, right]
    wheel_directions: [-1.0, -1.0, 1.0, 1.0]
    external_ratios: [1.0, 1.0, 1.0, 1.0]  # Output-shaft turns / wheel turn; NOT 36.
    wheel_rpm_scales: [1.0, 1.0, 1.0, 1.0]
    wheel_radius_m: 0.040
    track_width_m: 0.737
    max_velocity_rpm: 20.0
    command_timeout_s: 0.15
    command_frame: base_link

forge_keyboard_teleop:
  ros__parameters:
    command_mode: chassis
    speed_m_s: 0.08
    yaw_rate_rad_s: 0.28
    deadman_timeout_s: 0.15
    command_frame: base_link
