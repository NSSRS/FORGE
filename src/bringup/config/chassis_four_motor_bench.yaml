# Four secured, unloaded motors; physical wheel signs still require confirmation.
# Preserve the commissioned split bus: IDs 1/2 CAN1, IDs 3/4 CAN2.
motor_driver:
  ros__parameters:
    command_mode: chassis
    simulate: true
    execute: false
    mapping_confirmed: false
    interface: enp86s0
    max_current_a: 2.0
    motor_ids: [1, 2, 3, 4]
    motor_slots: [0, 1, 3, 4]
    bench_omit_motor_id: 0
    wheel_motor_ids: [1, 2, 3, 4]
    wheel_sides: [left, left, right, right]
    wheel_directions: [-1.0, -1.0, 1.0, 1.0]
    external_ratios: [1.0, 1.0, 1.0, 1.0]
    wheel_rpm_scales: [1.0, 1.0, 1.0, 1.0]
    wheel_radius_m: 0.040
    track_width_m: 0.737
    max_velocity_rpm: 5.0
    command_timeout_s: 0.15
    command_frame: base_link

keyboard_teleop:
  ros__parameters:
    command_mode: chassis
    speed_m_s: 0.02
    yaw_rate_rad_s: 0.07
    deadman_timeout_s: 0.15
    command_frame: base_link
