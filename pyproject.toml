[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "motors"
version = "0.1.0"
description = "FORGE ENCOS chassis and Damiao MC02 arm control"
requires-python = ">=3.10"

[project.optional-dependencies]
arm = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["motors*"]
